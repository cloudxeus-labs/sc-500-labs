apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: cloudxeus-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: <your-registry>.azurecr.io/backend:v1
          imagePullPolicy: IfNotPresent