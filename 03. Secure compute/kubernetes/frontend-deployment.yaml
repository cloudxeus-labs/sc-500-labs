apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: cloudxeus-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: <your-registry>.azurecr.io/webapp:v2
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080